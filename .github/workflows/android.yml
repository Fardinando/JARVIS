name: JARVIS Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run lint check
        run: ./gradlew lintDebug

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

  build:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PICOVOICE_ACCESS_KEY: ${{ secrets.PICOVOICE_ACCESS_KEY }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PICOVOICE_ACCESS_KEY: ${{ secrets.PICOVOICE_ACCESS_KEY }}

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 7

  notify:
    needs: [ validate, build ]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Send Telegram notification
        env:
          STATUS: ${{ needs.build.result }}
        run: |
          MSG="JARVIS BUILD: $STATUS"
          curl -s -X POST "https://api.telegram.org/bot8636115536/sendMessage" \
            -d "chat_id=@fernandoaas" \
            -d "text=$MSG" \
            -d "parse_mode=Markdown" > /dev/null
