name: JARVIS Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  TELEGRAM_CHAT_ID: "fardinandoaas"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Install Android SDK components
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME \
            "platforms;android-36" \
            "build-tools;36.0.0" || true

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Run lint
        run: ./gradlew lintDebug --continue || true

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  notify-success:
    needs: build
    if: success()
    runs-on: ubuntu-latest
    steps:
      - env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            -d "chat_id=fardinandoaas" \
            -d "text=JARVIS BUILD: ✅ SUCESSO\nAPK: https://github.com/Fardinando/JARVIS/actions" \
            -d "parse_mode=Markdown" > /dev/null

  notify-failure:
    needs: build
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            -d "chat_id=fardinandoaas" \
            -d "text=JARVIS BUILD: ❌ FALHOU\nLogs: https://github.com/Fardinando/JARVIS/actions" \
            -d "parse_mode=Markdown" > /dev/null
